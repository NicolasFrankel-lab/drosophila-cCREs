schema_version: 2
name: immutable final-BAM manifest
formats: [tsv]
path_resolution: Relative bam and bai paths are resolved against the manifest directory.
row_model: One row is one biological library after technical-run merging and final filtering.
required_columns:
  - library_id
  - assay
  - context
  - role
  - layout
  - bam
  - bai
  - genome
  - filtering_contract
  - bam_sha256
  - bai_sha256
  - qc_status
fields:
  library_id:
    type: string
    pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
  assay:
    type: enum
    values: [atac, h3k27ac, chip_histone]
  context:
    type: string
    pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
  role:
    type: enum
    values: [treatment]
  layout:
    type: enum
    values: [single, paired]
  bam:
    type: path
  bai:
    type: path
  genome:
    type: enum
    values: [dm6]
  filtering_contract:
    type: enum
    values: [short-read-processing-final-v2]
  bam_sha256:
    type: sha256
  bai_sha256:
    type: sha256
  qc_status:
    type: enum
    values: [pending_review, accepted, rejected]
  estimated_fragment_length_bp:
    type: integer
    minimum: 1
    allow_blank: true
  source_project:
    type: string
    allow_blank: true
  source_run_id:
    type: string
    allow_blank: true
  notes:
    type: string
    allow_blank: true
rules:
  - Every required library for each represented assay occurs exactly once.
  - Library metadata must agree with the accession sample sheet.
  - BAM and BAI paths must exist, be distinct, and not be reused by another row.
  - Full SHA-256 values are mandatory.
  - The v2 final-BAM contract retains blacklist-overlapping alignments; blacklist overlap is annotated on catalog elements instead of filtering reads.
  - Workflow validation checks BAM integrity, explicit-index readability, coordinate sorting, and exact reference sequence names and lengths.
  - pending_review and accepted BAMs may enter downstream peak calling and QC; master DHS construction accepts only reviewed accepted BAMs as inputs.
  - Master DHS construction requires an explicit accepted or rejected decision for every ATAC library; rejected rows remain in the reviewed manifest and are excluded from the master inputs.
  - Activity selection requires every treatment library to have a reviewed accepted or rejected status; pending_review is an error.
  - Rejected activity rows remain in the reviewed manifest, require a nonblank reason in notes, and are excluded explicitly rather than treated as missing.
  - Reviewed single-end histone libraries require estimated_fragment_length_bp; paired-end rows leave it blank.
  - Outside master construction and activity selection, a missing or rejected library is an error; the workflow never falls back to FASTQ acquisition.
